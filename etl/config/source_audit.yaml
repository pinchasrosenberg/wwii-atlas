# מרשם מחקרי למקורות — נבדק מול דפי המקור הרשמיים ב־2026-07-28.
#
# הקובץ הזה משלים את sources.yaml התפעולי. הוא עונה על ארבע שאלות נפרדות:
# 1. האם המקור סמכותי?
# 2. האם הוא מתאים לגרעין הנתונים שאנחנו רוצים לייצר?
# 3. האם מותר לקלוט ולפרסם אותו?
# 4. מה רמת הדיוק והכיסוי שאפשר לטעון לה?
#
# scientific_status:
#   approved    — אפשר לבנות עליו רשומות לאחר בדיקות האיכות הרגילות
#   conditional — שימוש אפשרי רק תחת תנאי מפורש (רישיון, ידני, או הצלבה)
#   blocked     — אין קליטה אוטומטית עד להסרת החסם
#   reference   — מקור עזר/אימות בלבד; אינו יוצר ישות מפה לבדו

