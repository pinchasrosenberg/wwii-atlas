# אישורי גישה למקורות שדורשים הסכמה בכתב.
#
# מקור עם access: permission ב-sources.yaml חסום לגישה אוטומטית עד
# שיסומן כאן true. זו לא בירוקרטיה — גרידה של uboat.net או של יד ושם
# בלי אישור פוגעת בפרויקט וביחסים עם המוסדות.
#
# לאחר קבלת אישור: שנו ל-true והוסיפו הפניה למסמך האישור.

granted:
  uboat_net: false            # ממתין לפנייה
  hague_convoys: false        # ממתין לפנייה
  ushmm_camps: false          # ממתין לפנייה
  yad_vashem_transports: false # ממתין לפנייה — קריטי, ראו R3
  ehri_portal: false          # נדרש bearer token ותנאי שימוש

