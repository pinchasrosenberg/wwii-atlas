<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>גיליון מגע — סמלי הסצנה</title>
<style>
  body{margin:0;background:#e6e3d9;color:#272420;font:13px/1.5 system-ui,sans-serif}
  h2{font-size:15px;margin:22px 12px 8px;border-bottom:1px solid #b9b3a2;padding-bottom:4px}
  .row{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px}
  .c{background:#dcd8ca;border:1px solid #cbc5b4;display:flex;flex-direction:column;
     align-items:center;justify-content:flex-end;padding:4px}
  .c span{font:9px/1.2 ui-monospace,monospace;color:#6b6555;margin-top:3px;
          max-width:96px;text-align:center;word-break:break-all}
  .dark{background:#191815;color:#ece7da}
  .dark .c{background:#24221d;border-color:#3b3830}
  .dark .c span{color:#8d8676}
  .dark h2{color:#ece7da;border-color:#3b3830}
</style>
</head>
<body>
<div id="light"></div>
<div id="dark" class="dark"></div>
<script type="module">
import { createSymbolCache, symbolSize } from './src/layers/scene-symbols.js?v=map-channel-19';

const cache = createSymbolCache();
const ZOOMS = [3, 5, 7, 9];

const BIG = new URLSearchParams(location.search).get('big');
function block(root, title, items, {zooms = [7]} = {}) {
  const h = document.createElement('h2'); h.textContent = title; root.appendChild(h);
  const row = document.createElement('div'); row.className = 'row'; root.appendChild(row);
  for (const it of items) {
    for (const z of zooms) {
      const icon = cache.iconFor(it.props);
      const px = BIG ? Number(BIG) : symbolSize(it.props, z);
      const cell = document.createElement('div'); cell.className = 'c';
      const img = document.createElement('img');
      img.src = icon.url; img.width = px; img.height = px;
      const lab = document.createElement('span');
      lab.textContent = `${it.label}${zooms.length > 1 ? ` z${z}·${px}px` : ''}`;
      cell.append(img, lab); row.appendChild(cell);
    }
  }
}

const BRANCHES = ['infantry','armor','artillery','mechanized_infantry','motorized_infantry',
  'anti_tank','air_defense','airborne','cavalry','mountain_infantry','engineers','marines'];
const GLYPHS = [
  ['Battle','event.battle','events','קרב'],
  ['CaptureEvent','event.capture','events','כיבוש'],
  ['Fortification','quality.explicit','neutral','ביצור'],
  ['Sinking','event.sinking','naval','טביעה'],
  ['Port','place.port','naval','נמל'],
  ['AirRaid','event.airraid','air','הפצצה'],
  ['Camp','place.camp','persecution','מחנה'],
  ['Station','place.rail','logistics','תחנה'],
  ['Plant','place.plant','logistics','מפעל'],
  ['City','','places','עיר'],
];

for (const [rootId, ] of [['light'],['dark']]) {
  const root = document.getElementById(rootId);

  block(root, 'צדדים', ['allies','axis','soviet','neutral','unknown'].map(side => ({
    label: side,
    props: {entity_kind:'Unit', style_token:`unit.infantry.${side==='axis'?'axis':'allies'}`,
            group_id:side, quality:'explicit', echelon:'division'},
  })));

  block(root, 'דרג', ['battalion','brigade','division','corps','army','army group'].map(e => ({
    label: e, props: {entity_kind:'Unit', group_id:'allies', quality:'explicit', echelon:e},
  })));

  block(root, 'דרגת טענה', ['explicit','derived','estimated','context','unknown'].map(q => ({
    label: q, props: {entity_kind:'Unit', group_id:'axis', quality:q,
                      echelon:'division', branch:'armor'},
  })));

  block(root, 'ענפים', BRANCHES.map(b => ({
    label: b, props: {entity_kind:'Unit', group_id:'allies', quality:'explicit',
                      echelon:'division', branch:b},
  })));

  block(root, 'מפקדה', [{label:'hq', props:{entity_kind:'Unit', group_id:'axis',
    quality:'explicit', echelon:'army', location_role:'headquarters'}}]);

  block(root, 'אירועים ומקומות', GLYPHS.map(([kind, token, group, label]) => ({
    label, props:{entity_kind:kind, style_token:token, group_id:group, quality:'explicit'},
  })));

  block(root, 'כל רמות הזום — קרב, עיר, ביצור, שריון', [
    {label:'קרב', props:{entity_kind:'Battle', style_token:'event.battle', group_id:'events', quality:'explicit'}},
    {label:'עיר', props:{entity_kind:'City', group_id:'places', quality:'explicit'}},
    {label:'ביצור', props:{entity_kind:'Fortification', group_id:'neutral', quality:'estimated'}},
    {label:'שריון', props:{entity_kind:'Unit', group_id:'axis', quality:'explicit', echelon:'division', branch:'armor'}},
  ], {zooms: ZOOMS});
}
window.__sheetReady = true;
</script>
</body>
</html>
