<!DOCTYPE html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><title>אירועים ומקומות</title>
<style>
body{margin:0;background:#e6e3d9;font:12px system-ui;color:#272420}
h2{font-size:13px;margin:8px 10px 4px;border-bottom:1px solid #b9b3a2;padding-bottom:3px}
.row{display:flex;flex-wrap:wrap;gap:5px;padding:0 10px}
.c{background:#dcd8ca;border:1px solid #cbc5b4;display:flex;flex-direction:column;
   align-items:center;padding:3px}
.c span{font:9px ui-monospace,monospace;color:#6b6555;margin-top:2px}
</style></head><body>
<div id="r"></div>
<script type="module">
import { createSymbolCache, symbolSize } from './src/layers/scene-symbols.js?v=map-channel-19';
const cache = createSymbolCache();
const root = document.getElementById('r');
function block(title, items, size){
  const h=document.createElement('h2');h.textContent=title;root.appendChild(h);
  const row=document.createElement('div');row.className='row';root.appendChild(row);
  for(const it of items){
    const icon=cache.iconFor(it.props);
    const cell=document.createElement('div');cell.className='c';
    const img=document.createElement('img');img.src=icon.url;
    img.width=it.px||size; img.height=it.px||size;
    const lab=document.createElement('span');lab.textContent=it.label;
    cell.append(img,lab);row.appendChild(cell);
  }
}
const G=[['Battle','event.battle','events','קרב'],['CaptureEvent','event.capture','events','כיבוש'],
 ['Fortification','','neutral','ביצור'],['Sinking','event.sinking','naval','טביעה'],
 ['Port','place.port','naval','נמל'],['ConvoyVoyage','','naval','ספינה'],
 ['AirRaid','event.airraid','air','הפצצה'],['Camp','place.camp','persecution','מחנה'],
 ['Station','place.rail','logistics','רכבת'],['Plant','place.plant','logistics','מפעל'],
 ['City','','places','עיר'],['SupplyObservation','','logistics','אספקה']];
block('אירועים ומקומות — 78px', G.map(([k,t,g,l])=>({label:l,
  props:{entity_kind:k,style_token:t,group_id:g,quality:'explicit'}})), 78);
block('אותם סמלים ב-34px (זום 7)', G.map(([k,t,g,l])=>({label:l,
  props:{entity_kind:k,style_token:t,group_id:g,quality:'explicit'}})), 34);
block('אותם סמלים ב-20px (זום 3)', G.map(([k,t,g,l])=>({label:l,
  props:{entity_kind:k,style_token:t,group_id:g,quality:'explicit'}})), 20);

const TIERS=[['כפר',0.10],['עיירה',0.50],['עיר',0.70],['מטרופולין',0.95]];
block('ארבע דרגות יישוב — גודל אמיתי לפי זום 7', TIERS.map(([l,w])=>({label:l,
  props:{entity_kind:'City',group_id:'places',quality:'explicit',display_weight:w},
  px:symbolSize({entity_kind:'City',display_weight:w},7)})));
block('אותן דרגות בזום 4', TIERS.map(([l,w])=>({label:l,
  props:{entity_kind:'City',group_id:'places',quality:'explicit',display_weight:w},
  px:symbolSize({entity_kind:'City',display_weight:w},4)})));
block('דרגת טענה — טנק', ['explicit','derived','estimated','context','unknown'].map(q=>({
  label:q, props:{entity_kind:'Unit',group_id:'axis',quality:q,echelon:'division',branch:'armor'}})), 72);
</script></body></html>
