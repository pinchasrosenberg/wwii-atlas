<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>אטלס מלחמת העולם השנייה — מפה עולמית בזמן</title>
<meta name="description" content="אטלס זמן אינטראקטיבי בעברית: גבולות עולמיים, קרבות פעילים, נתיבי אספקה ואבדות ימיות במלחמת העולם השנייה.">
<meta property="og:type" content="website">
<meta property="og:locale" content="he_IL">
<meta property="og:title" content="אטלס מלחמת העולם השנייה — מפה עולמית בזמן">
<meta property="og:description" content="מפת זמן אינטראקטיבית של גבולות, קרבות ונתיבי אספקה ברחבי העולם, עם מקורות ושקיפות מחקרית.">
<meta property="og:image" content="./og-supply-network.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="מפת שרשרת אספקה המחברת מפעלים, נמלים, מפקדות וקרבות">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="./og-supply-network.png">

<!--
  CSP לפי סעיף 12.1 באפיון. MapLibre ו-deck.gl מאוחסנים מקומית.
  connect-src נפתח בדיוק לשני מקורות: גשר הגרף המקומי על 8787, ותו לא.
  ‏data: נדרש כי deck.gl מושך כל אייקון של IconLayer דרך fetch, גם כשהוא
  ‏data URL שנוצר בדפדפן עצמו. בלעדיו כל סמל על המפה נכשל בשקט עם
  ‏"deck: Failed to fetch" והמפה מציגה קווים בלבד. זה אינו מקור רשת.
  בלעדיו הדפדפן חוסם את /map/events ואת שליפת הפיצ׳רים בשקט, והמפה
  נשארת ריקה בלי שום הודעת שגיאה — בדיוק מה שקרה. selftest.html אינו
  נושא CSP ולכן הבדיקות עברו בזמן שהמפה עצמה הייתה חסומה.
-->
<!-- ⚠️ ‏frame-ancestors אינו קיים כאן בכוונה: הדפדפן מתעלם ממנו כשהוא
     ‏מגיע דרך <meta> ורק רושם שגיאה. הגנת מסגור שייכת לכותרת HTTP,
     ‏ומוגדרת בשרת שמגיש את הדף. -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self';
  style-src 'self' 'unsafe-inline';
  img-src 'self' data: blob:;
  connect-src 'self' data: https://ww2-atlas-api.example.workers.dev;
  worker-src 'self' blob:;
  object-src 'none';
  base-uri 'none';
">
<meta name="referrer" content="no-referrer">
<!-- The public, read-only graph API (see ../api). `node tools/set-api-url.mjs <url>` updates this tag and the CSP above together. -->
<meta name="ww2-graph-api" content="https://ww2-atlas-api.example.workers.dev">

<link rel="stylesheet" href="./vendor/maplibre-gl.css">
<link rel="stylesheet" href="./src/styles.css?v=map-channel-19">
</head>
<body data-map-mode="overview">

<div id="app">
  <div id="map" role="application" aria-label="מפה אינטראקטיבית — גררו להזזה והשתמשו בגלגלת או בצביטה לזום"></div>
  <canvas id="deck-canvas" aria-hidden="true"></canvas>
  <div id="season-tint" aria-hidden="true"></div>
  <div id="map-tooltip" role="tooltip"></div>

  <header id="topbar">
    <div class="brand">
      <span class="brand-kicker">מפת המערכת שמאחורי החזית</span>
      <strong>אטלס מלחמת העולם השנייה</strong>
    </div>
    <div class="mode-switch" role="group" aria-label="מצב מפה">
      <button type="button" data-map-mode="overview" class="is-active">מפה כללית</button>
      <button type="button" data-map-mode="relations">בחירה וקשרים</button>
    </div>
    <nav class="regions" aria-label="מעבר בין זירות">
      <button type="button" data-region="world">העולם</button>
      <button type="button" data-region="europe" class="is-active">אירופה</button>
      <button type="button" data-region="atlantic">האטלנטי</button>
      <button type="button" data-region="pacific">האוקיינוס השקט</button>
    </nav>
    <div class="stage-badge">
      <span>אב־טיפוס אספקה</span>
      <small>נתון אמיתי + mock מסומן</small>
    </div>
  </header>

  <aside id="scene-panel" data-status="idle" data-collapsed="false" role="status"
         aria-live="polite" aria-label="סצנה שהצ׳אט ביקש להציג"></aside>

  <aside id="transport-mode" hidden aria-label="אופן התובלה לשכבת התוואי"></aside>

  <div id="select-tools" hidden>
    <button type="button" id="select-start" aria-pressed="false">✧ בחר אזור</button>
    <span id="select-hint" hidden>לחץ קודקודים · לחיצה על הקודקוד הראשון סוגרת · Esc לביטול</span>
  </div>

  <div id="stats">
    <span class="stat" id="fps">— FPS</span>
    <span class="stat" id="tier">מזהה…</span>
    <span class="stat" id="season-label">קיץ</span>
  </div>

  <div id="map-controls" aria-label="בקרת מפה">
    <button type="button" data-map-action="zoom-in" aria-label="זום פנימה" title="זום פנימה">+</button>
    <button type="button" data-map-action="zoom-out" aria-label="זום החוצה" title="זום החוצה">−</button>
    <button type="button" data-map-action="world" aria-label="הצגת כל העולם" title="הצגת כל העולם">◎</button>
    <button type="button" data-map-action="motion" class="is-active" aria-label="השהיית אנימציות" title="השהיית אנימציות">◉</button>
    <span>גררו להזזה · גלגלת או צביטה לזום</span>
  </div>

  <button id="atlas-dock-toggle" type="button" aria-label="פתיחת סביבת העבודה" aria-controls="atlas-dock" aria-expanded="false">
    <span>☰</span><strong>אטלס</strong>
  </button>
  <aside id="atlas-dock" aria-label="סביבת העבודה של האטלס" aria-hidden="true" hidden>
    <header class="atlas-dock-head">
      <strong data-dock-title>שכבות האטלס</strong>
      <button type="button" data-dock-close aria-label="סגירת סביבת העבודה">×</button>
    </header>
    <nav class="atlas-dock-tabs" role="tablist" aria-label="תוכן סביבת העבודה">
      <button type="button" role="tab" data-dock-tab="layers" data-dock-scope="overview">שכבות</button>
      <button type="button" role="tab" data-dock-tab="events" data-dock-scope="overview">אירועים</button>
      <button type="button" role="tab" data-dock-tab="tools" data-dock-scope="overview">כלים</button>
      <button type="button" role="tab" data-dock-tab="legend" data-dock-scope="overview">מקרא</button>
      <button type="button" role="tab" data-dock-tab="selection" data-dock-scope="relations">ישות</button>
      <button type="button" role="tab" data-dock-tab="chain" data-dock-scope="relations">שרשרת</button>
      <button type="button" role="tab" data-dock-tab="details" data-dock-scope="both">פרטים</button>
    </nav>
    <div class="atlas-dock-body">
      <section class="atlas-dock-panel" data-dock-panel="layers"><aside id="layers" aria-label="בקרת שכבות"></aside></section>
      <section class="atlas-dock-panel" data-dock-panel="events"><aside id="event-feed" aria-label="אירועים סביב התאריך הנבחר" aria-live="polite"></aside></section>
      <section class="atlas-dock-panel" data-dock-panel="tools"><div id="workbench" aria-label="כלי ניתוח וחיפוש"></div></section>
      <section class="atlas-dock-panel" data-dock-panel="legend"><div id="legend" aria-label="מקרא"></div></section>
      <section class="atlas-dock-panel" data-dock-panel="selection"><aside id="selection-panel" aria-label="ישות נבחרת וקשריה" aria-live="polite"></aside></section>
      <section class="atlas-dock-panel" data-dock-panel="chain"><section id="chain-dock" aria-label="שרשרת האספקה הפעילה"></section></section>
      <section class="atlas-dock-panel" data-dock-panel="details"><div id="cards"></div><p class="dock-empty-details">לחצו על ישות במפה כדי לפתוח את פרטיה.</p></section>
    </div>
  </aside>
  <div id="analysis-banner" role="status" aria-live="polite"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <nav id="story-views" aria-label="תצוגות סיפור מוכנות">
    <span>מבט מהיר</span>
    <button type="button" data-story-view="overview" class="is-active">התמונה הכללית</button>
    <button type="button" data-story-view="front">החזית</button>
    <button type="button" data-story-view="industry">תעשייה ואספקה</button>
    <button type="button" data-story-view="persecution">רדיפה וגירוש</button>
    <button type="button" data-story-view="sea">המלחמה בים</button>
  </nav>
  <div id="timeline" aria-label="ציר הזמן"></div>

  <div id="boot">טוען את המנוע…</div>
</div>

<script src="./src/boot-watchdog.js?v=map-channel-19"></script>
<script type="module" src="./vendor/maplibre-global.mjs"></script>
<script src="./vendor/deck.gl.min.js"></script>
  <script type="module" src="./src/main.js?v=map-channel-19"></script>

</body>
</html>
