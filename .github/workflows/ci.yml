name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Python deps for the normaliser parity test and the loader test
        run: pip install rapidfuzz unidecode neo4j
      - name: API tests
        working-directory: api
        run: npm test
      - name: Map tests
        working-directory: map
        run: npm test
      - name: Graph loader safety tests
        run: python -m unittest graph/test_load_snapshot.py
