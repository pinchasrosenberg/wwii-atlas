name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Python deps for the loader test
        run: pip install neo4j
      - name: API tests
        working-directory: api
        run: npm test
      - name: Map site checks (scripts parse, CSP, SRI, no local references)
        run: node map/tools/check-site.mjs
      - name: Graph loader safety tests
        run: python -m unittest graph/test_load_snapshot.py
