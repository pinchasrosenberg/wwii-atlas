# Publishes the site to GitHub Pages (Settings → Pages → Source: GitHub Actions).
name: Deploy map to GitHub Pages
on:
  push:
    branches: [main]
    paths: ["map/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Check the site before publishing
        run: node map/tools/check-site.mjs
      - name: Collect the site (tooling stays out)
        run: rsync -a --exclude tools map/ _site/ && touch _site/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
