# Cloudflare Worker for the public WWII Atlas graph API.
# Secrets are NEVER stored here. Set them once with:
#   wrangler secret put NEO4J_QUERY_URL   # https://<id>.databases.neo4j.io/db/neo4j/query/v2
#   wrangler secret put NEO4J_USER
#   wrangler secret put NEO4J_PASSWORD
#   wrangler secret put CONSOLE_KEY       # optional; enables the owner-only /query console
name = "ww2-atlas-api"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
# Comma-separated list of origins allowed to call the API from a browser.
ALLOWED_ORIGINS = "https://pinchasrosenberg.github.io"

[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

# Weekly keep-alive so the free hosted graph is not paused for inactivity.
[triggers]
crons = ["17 6 * * 1"]
